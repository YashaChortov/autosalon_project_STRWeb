{% extends 'base.html' %}
{% block content %}
<h2>Новости</h2>

{% for article in articles %}
<article>
    <h3>{{ article.title }}</h3>

    <figure>
        {% if article.image %}
            <img src="{{ article.image.url }}" alt="{{ article.title }}" width="400" loading="lazy">
        {% endif %}
        <figcaption>Иллюстрация к новости</figcaption>
    </figure>

    <p>{{ article.summary }}</p>
    <p>
        <time datetime="{{ article.published_at|date:'Y-m-d\TH:i:s' }}">
            <mark>{{ article.published_at|date:"d/m/Y H:i" }}</mark>
        </time>
    </p>
    <a href="{% url 'content:news_detail' article.pk %}">Читать далее</a>
</article>
<hr>
{% empty %}
<p>Новостей пока нет.</p>
{% endfor %}

<p>
    <a href="/media/banners/banner1_ETfQcF0.jpg" download="news-banner.jpg">
        📥 Скачать баннер (download)
    </a>
</p>
{% endblock %}
